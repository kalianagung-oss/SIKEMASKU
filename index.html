    <script>
        window.students = [
            { id: 1, name: 'Dhyla Naura Safiya', nis: '001', phone: '6289472224251' },
            { id: 2, name: 'Alfarizqi Tiyo Ghifari', nis: '002', phone: '628541724480' },
            { id: 3, name: 'Herdian Shaka Dananjaya', nis: '003', phone: '6285495062244' },
            { id: 4, name: 'Diandra Zahiya Handaru', nis: '004', phone: '6287725127257' }
        ];

        window.attendanceData = {};

        const MOOD_OPTIONS = [
            { label: 'Kondusif', icon: '😌' },
            { label: 'Fokus/Semangat', icon: '🎯' },
            { label: 'Gelisah/Tantrum', icon: '😟' },
            { label: 'Sensori Overload', icon: '🤯' },
            { label: 'Kurang Sehat', icon: '🤒' }
        ];

        function localISODate(d = new Date()) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function formatFullDateIndonesian(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-').map(Number);
            const dateObj = new Date(year, month - 1, day);
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            return `${days[dateObj.getDay()]}, ${day} ${months[month - 1]} ${year}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const today = '2026-07-30';
            document.getElementById('selectedDate').value = today;
            document.getElementById('selectedMonth').value = '2026-07';
            
            document.getElementById('topDateBadge').textContent = formatFullDateIndonesian(today);
            document.getElementById('dailyDateTitle').textContent = formatFullDateIndonesian(today);

            renderDailyCards();
            renderMonthlyTable();
            populateStudentFilter();
            renderSensoryJournal();
        });

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${t}`).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white', 'bg-sky-700', 'shadow-sm');
                btn.classList.add('text-sky-100');
            });
            
            const activeBtn = document.getElementById(`nav-${t}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-sky-100');
                activeBtn.classList.add('text-white', 'bg-sky-700', 'shadow-sm');
            }

            if (t === 'monthly') renderMonthlyTable();
            if (t === 'sensory') renderSensoryJournal();
        }

        function renderDailyCards() {
            const date = document.getElementById('selectedDate').value;
            const container = document.getElementById('studentCardsContainer');
            container.innerHTML = '';

            students.forEach(student => {
                const rec = attendanceData[date]?.[student.id] || { status: 'H', mood: 'Kondusif', note: '' };
                const nisStr = String(student.nis).padStart(3, '0');
                
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-sm space-y-4';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-sky-600 text-white font-extrabold flex items-center justify-center text-xs shadow-sm">
                                ${nisStr}
                            </div>
                            <div>
                                <h3 class="font-extrabold text-slate-800 text-sm sm:text-base">${student.name}</h3>
                                <p class="text-[11px] text-slate-400 font-bold">NIS/ID: ${nisStr}</p>
                            </div>
                        </div>
                        <button type="button" onclick="sendWhatsApp(${student.id})" class="px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold flex items-center space-x-1.5">
                            <i class="fa-brands fa-whatsapp text-emerald-600 text-sm"></i>
                            <span>Kirim WA</span>
                        </button>
                    </div>

                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">STATUS KEHADIRAN</label>
                        <div class="grid grid-cols-4 gap-2 text-xs">
                            ${['H', 'S', 'I', 'A'].map(st => `
                                <button type="button" onclick="saveAttendance(${student.id}, '${st}')" class="py-2.5 rounded-xl font-bold border text-center text-xs ${rec.status === st ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-600'}">
                                    ${st === 'H' ? 'Hadir (H)' : st === 'S' ? 'Sakit (S)' : st === 'I' ? 'Izin (I)' : 'Alfa (A)'}
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">KONDISI / PERILAKU</label>
                        <div class="flex flex-wrap gap-1.5">
                            ${MOOD_OPTIONS.map(m => `
                                <button type="button" onclick="saveMood(${student.id}, '${m.label}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${rec.mood === m.label ? 'bg-emerald-100 text-emerald-900 border-emerald-400' : 'bg-slate-50 text-slate-600'}">
                                    <span>${m.icon}</span> <span>${m.label}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-1.5">CATATAN HARIAN</label>
                        <input type="text" value="${rec.note || ''}" placeholder="Tuliskan catatan harian..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-700 font-medium">
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function saveAttendance(studentId, status) {
            const date = document.getElementById('selectedDate').value;
            if (!attendanceData[date]) attendanceData[date] = {};
            if (!attendanceData[date][studentId]) attendanceData[date][studentId] = { status: 'H', mood: 'Kondusif', note: '' };
            attendanceData[date][studentId].status = status;
            renderDailyCards();
        }

        function saveMood(studentId, mood) {
            const date = document.getElementById('selectedDate').value;
            if (!attendanceData[date]) attendanceData[date] = {};
            if (!attendanceData[date][studentId]) attendanceData[date][studentId] = { status: 'H', mood: 'Kondusif', note: '' };
            attendanceData[date][studentId].mood = mood;
            renderDailyCards();
        }

        function renderMonthlyTable() {
            const daysHeaderRow = document.getElementById('daysHeaderRow');
            let headerHTML = `<th class="p-1.5 border text-center">NO</th><th class="p-1.5 border text-center">NIS</th><th class="p-1.5 border">NAMA SISWA</th>`;
            for (let d = 1; d <= 31; d++) headerHTML += `<th class="p-0.5 border text-center w-6 text-[10px]">${d}</th>`;
            headerHTML += `<th class="p-1 border text-center bg-emerald-100">H</th><th class="p-1 border text-center bg-amber-100">S</th><th class="p-1 border text-center bg-sky-100">I</th><th class="p-1 border text-center bg-rose-100">A</th><th class="p-1 border text-center">%</th>`;
            daysHeaderRow.innerHTML = headerHTML;

            const monthlyTableBody = document.getElementById('monthlyTableBody');
            monthlyTableBody.innerHTML = '';

            students.forEach((student, index) => {
                const nisStr = String(student.nis).padStart(3, '0');
                let rowHTML = `<tr>
                    <td class="p-1.5 border text-center font-bold">${index + 1}</td>
                    <td class="p-1.5 border text-center font-bold text-slate-500">${nisStr}</td>
                    <td class="p-1.5 border font-bold text-slate-800">${student.name}</td>`;
                
                for (let d = 1; d <= 31; d++) rowHTML += `<td class="p-0.5 border text-center text-emerald-700 font-bold bg-emerald-50">H</td>`;
                rowHTML += `<td class="p-1 border text-center font-black">14</td><td class="p-1 border text-center font-black">0</td><td class="p-1 border text-center font-black">0</td><td class="p-1 border text-center font-black">0</td><td class="p-1 border text-center font-black">100%</td></tr>`;
                monthlyTableBody.innerHTML += rowHTML;
            });
        }

        function populateStudentFilter() {
            const sel = document.getElementById('sensoryStudentFilter');
            sel.innerHTML = `<option value="ALL">Semua Murid</option>`;
            students.forEach(s => {
                sel.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });
        }

        function renderSensoryJournal() {
            const listContainer = document.getElementById('monthlyNotesList');
            listContainer.innerHTML = '';

            students.forEach(student => {
                const divCard = document.createElement('div');
                divCard.className = 'bg-white rounded-2xl p-4 border border-slate-200 text-xs space-y-2 shadow-sm';
                divCard.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-2">
                        <span class="text-slate-900 font-extrabold text-sm">${student.name}</span>
                        <span class="px-3 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-full font-bold text-[11px]">Kondusif</span>
                    </div>
                    <p class="text-slate-700 leading-relaxed font-medium pt-1">Hari ini siswa cukup kondusif di kelas, melakukan aktivitas belajar sesuai arahan.</p>
                `;
                listContainer.appendChild(divCard);
            });
        }

        function sendWhatsApp(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;
            window.open(`https://wa.me/${student.phone}`, '_blank');
        }
    </script>
</body>
</html>
